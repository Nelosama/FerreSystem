name: Operación de ferretería
on:
  pull_request:
    # CENTINELA: también las integraciones hacia ramas claude/**; antes solo se ejecutaba hacia main.
    branches: [main, 'claude/**']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_URL: https://api.example.test/api
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/isolated
      DIRECT_URL: postgresql://postgres@127.0.0.1:5432/isolated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependencias
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend
      - name: Validar esquema y generar cliente
        working-directory: backend
        run: |
          npx prisma validate
          npx prisma generate
      - name: "Frontend: tipos, bundle y pruebas"
        working-directory: frontend
        run: |
          npm run build
          npm test
      - name: "Frontend: arranque y navegación en Chromium"
        id: browser
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Conservar evidencia de fallos en el navegador
        if: ${{ failure() && steps.browser.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-failure
          path: frontend/test-results/
          retention-days: 7
      - name: "Backend: compilación y pruebas"
        working-directory: backend
        run: |
          npm run build
          npm test
          npm run test:scripts
      - name: Preparar PostgreSQL temporal
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          pg_bin=$(pg_config --bindir)
          echo "PG_BIN=$pg_bin" >> "$GITHUB_ENV"
      - name: Integración con persistencia PostgreSQL real
        working-directory: backend
        env:
          REAL_SETTINGS_BROWSER: '1'
        run: npm run test:integration
  guard-base-datos:
    # CENTINELA: bloquea comandos destructivos (db push, migrate dev/reset, seed) y cambios en migraciones publicadas.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Control de migraciones y comandos destructivos
        run: node backend/scripts/verificar-migraciones.mjs --base "origin/${GITHUB_BASE_REF:-main}"

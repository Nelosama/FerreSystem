name: Piloto con API y PostgreSQL reales
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install dependencies
      run: |
        npm ci --prefix backend
        npm ci --prefix frontend
    - name: PostgreSQL y Restic para pruebas aisladas
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql restic
        echo "PG_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"
    - name: Generar cliente Prisma
      working-directory: backend
      env:
        DATABASE_URL: postgresql://postgres@127.0.0.1:1/isolated
        DIRECT_URL: postgresql://postgres@127.0.0.1:1/isolated
      run: npx prisma generate
    - name: Install Playwright Browsers
      working-directory: frontend
      run: npx playwright install --with-deps chromium
    - name: Respaldo cifrado, fallos de restauración y snapshot concurrente
      working-directory: backend
      env:
        FS41_INTEGRATION: '1'
      run: node scripts/backup-worker.integration.mjs
    - name: Ciclo completo, roles, contingencia y reconciliación
      working-directory: frontend
      # run.sh crea su propia base y claves efímeras, nunca carga .env.
      run: npm run test:e2e-real
    - name: Reinicio y restauración de la aplicación
      shell: bash
      run: bash backend/scripts/simulacro-recuperacion.sh | tee /tmp/pilot-recovery.log
    - name: Ensayo de actualización y reversión en copias aisladas
      shell: bash
      run: bash backend/scripts/ensayo-actualizacion-preproduccion.sh | tee /tmp/pilot-upgrade.log
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: piloto-real-evidence
        path: |
          frontend/test-results-real/
          /tmp/pilot-recovery.log
          /tmp/pilot-upgrade.log
        retention-days: 30
